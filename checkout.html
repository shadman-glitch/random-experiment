<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA Checkout — Fast & Secure</title>
  <meta name="description" content="Complete your purchase with fast, secure checkout and free tracked shipping." />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- Clean Checkout Header -->
  <header style="border-bottom:1px solid var(--border-subtle); padding:1rem 2rem; background:var(--bg-primary);">
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" class="brand-logo" aria-label="AURA Home">
        <svg class="brand-swoosh" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.707 5.293a1 1 0 0 0-1.414 0L9 16.586l-4.293-4.293a1 1 0 0 0-1.414 1.414l5 5a1 1 0 0 0 1.414 0l12-12a1 1 0 0 0 0-1.414Z"/>
        </svg>
        <span>AURA</span>
      </a>
      <div style="font-size:0.85rem; color:var(--text-secondary); display:flex; align-items:center; gap:0.4rem;">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Secure 256-Bit SSL Checkout</span>
      </div>
    </div>
  </header>

  <main class="container" style="max-width:1200px;">
    <div class="checkout-page-grid">
      <!-- Left Column: Forms -->
      <div>
        <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:2rem; letter-spacing:-0.02em;">Checkout</h1>

        <form id="nike-checkout-form" onsubmit="handleCheckoutSubmit(event)">
          <!-- Step 1: Delivery Address -->
          <div class="checkout-step-block">
            <h2 class="step-num-title">1. Delivery Address</h2>
            <div class="floating-input-grid">
              <div class="full-span">
                <input type="text" id="chk-name" class="nike-form-input" placeholder="Full Name" required />
              </div>
              <div class="full-span">
                <input type="email" id="chk-email" class="nike-form-input" placeholder="Email Address for Tracking" required />
              </div>
              <div class="full-span">
                <input type="text" id="chk-address" class="nike-form-input" placeholder="Street Address" required />
              </div>
              <div>
                <input type="text" id="chk-city" class="nike-form-input" placeholder="City" required />
              </div>
              <div>
                <input type="text" id="chk-zip" class="nike-form-input" placeholder="Postal / Zip Code" required />
              </div>
            </div>
          </div>

          <!-- Step 2: Delivery Options -->
          <div class="checkout-step-block">
            <h2 class="step-num-title">2. Delivery Options</h2>
            <div style="display:flex; flex-direction:column; gap:0.75rem;">
              <label style="display:flex; align-items:center; justify-content:space-between; padding:1.2rem; border:1.5px solid var(--border-dark); border-radius:var(--radius-sm); cursor:pointer; background:var(--bg-secondary);">
                <div style="display:flex; align-items:center; gap:0.75rem;">
                  <input type="radio" name="delivery" checked style="accent-color:var(--text-primary);" />
                  <div>
                    <strong>Standard Delivery</strong>
                    <div style="font-size:0.82rem; color:var(--text-secondary);">Arrives in 2–4 business days</div>
                  </div>
                </div>
                <strong style="color:var(--accent-green);">FREE</strong>
              </label>
            </div>
          </div>

          <!-- Step 3: Payment -->
          <div class="checkout-step-block">
            <h2 class="step-num-title">3. Payment</h2>
            <div class="floating-input-grid">
              <div class="full-span">
                <input type="text" class="nike-form-input" placeholder="Card Number (Simulated)" value="4242 •••• •••• 4242" />
              </div>
              <div>
                <input type="text" class="nike-form-input" placeholder="MM / YY" value="12/28" />
              </div>
              <div>
                <input type="text" class="nike-form-input" placeholder="CVV" value="888" />
              </div>
            </div>
          </div>

          <button type="submit" class="btn-nike-checkout" style="padding:1.25rem; font-size:1.05rem;">
            Place Order
          </button>
        </form>
      </div>

      <!-- Right Column: Order Summary -->
      <div>
        <div class="order-summary-card">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <h2 class="summary-title">In Your Bag</h2>
            <a href="cart.html" style="font-size:0.85rem; color:var(--text-secondary); text-decoration:underline;">Edit</a>
          </div>

          <div id="checkout-items-list" style="display:flex; flex-direction:column; gap:1rem; border-bottom:1px solid var(--border-subtle); padding-bottom:1.5rem;">
            <!-- Populated via store.js -->
          </div>

          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="chk-subtotal">$0.00</strong>
          </div>
          <div class="summary-row" id="chk-discount-row" style="display:none; color:var(--accent-green);">
            <span>Discount</span>
            <strong id="chk-discount">-$0.00</strong>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <strong>FREE</strong>
          </div>
          <div class="summary-row">
            <span>Estimated Tax</span>
            <strong id="chk-tax">$0.00</strong>
          </div>
          <div class="summary-row total-bold">
            <span>Total</span>
            <span id="chk-total">$0.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api-service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const itemsList = document.getElementById('checkout-items-list');
      const subtotalEl = document.getElementById('chk-subtotal');
      const discountRow = document.getElementById('chk-discount-row');
      const discountEl = document.getElementById('chk-discount');
      const taxEl = document.getElementById('chk-tax');
      const totalEl = document.getElementById('chk-total');

      const totals = appStore.getCartTotals();
      if (totals.totalItems === 0) {
        window.location.href = 'cart.html';
        return;
      }

      subtotalEl.textContent = `$${totals.subtotal.toFixed(2)}`;
      taxEl.textContent = `$${totals.tax.toFixed(2)}`;
      totalEl.textContent = `$${totals.finalTotal.toFixed(2)}`;

      if (totals.discountAmount > 0) {
        discountRow.style.display = 'flex';
        discountEl.textContent = `-$${totals.discountAmount.toFixed(2)}`;
      }

      itemsList.innerHTML = appStore.state.cart.map(item => `
        <div style="display:flex; gap:1rem; align-items:center;">
          <img src="${item.image}" alt="${item.name}" style="width:64px; height:64px; object-fit:contain; background:var(--bg-secondary); border-radius:var(--radius-xs);" />
          <div style="flex:1;">
            <div style="font-weight:700; font-size:0.9rem;">${item.name}</div>
            <div style="font-size:0.8rem; color:var(--text-secondary);">${item.color} • Qty: ${item.quantity}</div>
          </div>
          <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
        </div>
      `).join('');
    });

    window.handleCheckoutSubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('chk-name').value.trim();
      const email = document.getElementById('chk-email').value.trim();
      const address = document.getElementById('chk-address').value.trim();
      const city = document.getElementById('chk-city').value.trim();
      const zip = document.getElementById('chk-zip').value.trim();

      const totals = appStore.getCartTotals();
      const payload = {
        customer: { name, email, address, city, postalCode: zip },
        items: appStore.state.cart,
        totals: totals
      };

      const result = await apiService.submitOrder(payload);
      if (result && result.success) {
        appStore.clearCart();
        window.location.href = `order-success.html?orderId=${encodeURIComponent(result.orderId)}&email=${encodeURIComponent(email)}&eta=${encodeURIComponent(result.estimatedDelivery)}`;
      }
    };
  </script>
</body>
</html>
